<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting – MACHHAD</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--sky:#E8ECF8;--ink:#1E2448;--ink-soft:#4A5078;--sun:#F2A93B;--rose:#E86A6A;--paper:#fff;--line:#CDD3EA}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Source Sans 3",system-ui,sans-serif;background:var(--sky);color:var(--ink);min-height:100vh;
       display:flex;align-items:center;justify-content:center;padding:24px;font-size:18px;line-height:1.6}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:40px;max-width:480px;width:100%;text-align:center}
  .brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:22px;margin-bottom:28px}
  h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:30px;line-height:1.15;margin-bottom:12px}
  p{color:var(--ink-soft);margin-bottom:24px}
  .dot{width:56px;height:56px;border-radius:50%;margin:0 auto 20px;background:var(--sun)}
  .dot.err{background:var(--rose)}
  .loading .dot{animation:pulse 1s ease-in-out infinite alternate}
  @keyframes pulse{to{transform:scale(.7);opacity:.6}}
  @media (prefers-reduced-motion:reduce){.loading .dot{animation:none}}
  .btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:600;padding:14px 26px;border-radius:999px}
  .btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
</style>
</head>
<body>
  <main class="card loading" id="card">
    <div class="brand">MACHHAD</div>
    <div class="dot" id="dot" aria-hidden="true"></div>
    <h1 id="title">Connecting your TikTok account</h1>
    <p id="text">This takes a few seconds.</p>
    <a class="btn" id="btn" href="/" hidden>Back to home</a>
  </main>

<script>
  const card = document.getElementById("card");
  const title = document.getElementById("title");
  const text = document.getElementById("text");
  const btn = document.getElementById("btn");
  const dot = document.getElementById("dot");

  function showError(msg) {
    card.classList.remove("loading");
    dot.classList.add("err");
    title.textContent = "Connection failed";
    text.textContent = msg + " Please try again.";
    btn.textContent = "Back to home";
    btn.href = "/";
    btn.hidden = false;
  }

  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const error = params.get("error");
  // Remove the code from the address bar
  history.replaceState(null, "", "/callback");

  if (error) {
    showError(error === "access_denied" ? "You did not allow access." : "TikTok returned an error.");
  } else if (!code) {
    showError("No login code was received.");
  } else {
    fetch("/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code })
    })
      .then(r => r.json().then(d => ({ ok: r.ok, d })))
      .then(({ ok, d }) => {
        if (!ok) return showError(d.error || "Something went wrong.");
        card.classList.remove("loading");
        title.textContent = "TikTok account connected";
        text.textContent = "You will review every video before it is posted.";
        btn.textContent = "Continue to your videos";
        btn.href = "/post.html";
        btn.hidden = false;
      })
      .catch(() => showError("Network error."));
  }
</script>
</body>
</html>
